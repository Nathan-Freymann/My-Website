<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Your Name</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <nav class="navbar container">
            <a href="index.html" class="logo">Your Name</a>
            <button class="menu-toggle" aria-label="Toggle navigation" id="menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="timeline.html">My Journey</a></li>
                <li><a href="activities.html">Activities</a></li>
                <li><a href="contact.html" class="btn btn-primary">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-wrapper container">
    <h2>📧 Get in Touch</h2>
    <p>I'm always open to new opportunities, collaborations, or just a friendly chat!</p>

    <form class="contact-form" action="#" method="POST"> 
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Your Full Name">
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="your.email@example.com">
        </div>
        
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required placeholder="Tell me about your project or idea..."></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary large-button">Send Message</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem;">Or connect directly: **[Your Email Address]**</p>

</main>
    
    <footer class="main-footer">
        <div class="container footer-content">
            <p>&copy; <span id="current-year"></span> Your Name. All rights reserved.</p>
            <div class="social-links">
                <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
